name: Digital Compass Public Ops Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops_worker.yml"
      - "ops/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: digital-compass-public-ops
  cancel-in-progress: false

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request OIDC token for prototype research
        id: oidc_research
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=digital-compass-public-runner")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Claim prototype research tasks
        id: claim_research
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc_research.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"action":"claim_prototype_research"}' \
            "https://xnoalyxxrjyovivdeojo.supabase.co/functions/v1/github-worker-bridge" \
            -o prototype-research-tasks.json
          COUNT="$(python -c 'import json; d=json.load(open("prototype-research-tasks.json")); print(len(d.get("tasks",[])))')"
          COMMAND_ID="$(python -c 'import json; d=json.load(open("prototype-research-tasks.json")); print(d.get("command_id") or "")')"
          echo "Prototype research tasks: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then echo "has_tasks=true" >> "$GITHUB_OUTPUT"; else echo "has_tasks=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node
        if: steps.claim_research.outputs.has_tasks == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install prototype research dependency
        if: steps.claim_research.outputs.has_tasks == 'true'
        run: npm install --no-save cheerio@1.0.0

      - name: Run prototype research
        id: run_research
        if: steps.claim_research.outputs.has_tasks == 'true'
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc_research.outputs.token }}
          PROTOTYPE_RESEARCH_TASK_FILE: prototype-research-tasks.json
        run: node ops/prototype-research.mjs

      - name: Finalize prototype research queue command
        if: always() && steps.claim_research.outputs.command_id != ''
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc_research.outputs.token }}
          COMMAND_ID: ${{ steps.claim_research.outputs.command_id }}
          WORKER_OUTCOME: ${{ steps.run_research.outcome }}
          PROCESSED: ${{ steps.run_research.outputs.processed }}
          FAILURES: ${{ steps.run_research.outputs.failures }}
          PARTIAL: ${{ steps.run_research.outputs.partial }}
        run: |
          set -euo pipefail
          STATUS="SUCCEEDED"; ERROR=""
          if [ "${WORKER_OUTCOME}" = "failure" ]; then STATUS="FAILED"; ERROR="OIDC prototype research worker failed"; fi
          BODY="$(python - <<'PY'
          import json,os
          print(json.dumps({
            'action':'finish_stage_command','command_id':int(os.environ['COMMAND_ID']),
            'command_type':'PROTOTYPE_RESEARCH','status':os.environ['STATUS'],
            'result':{'processed':int(os.environ.get('PROCESSED') or 0),'failures':int(os.environ.get('FAILURES') or 0),'partial':int(os.environ.get('PARTIAL') or 0),'worker':'OIDC_PUBLIC_RESEARCH_V1'},
            'error_message':os.environ.get('ERROR') or None
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" \
            --data "$BODY" "https://xnoalyxxrjyovivdeojo.supabase.co/functions/v1/github-worker-bridge"
        env:
          STATUS: ${{ steps.run_research.outcome == 'failure' && 'FAILED' || 'SUCCEEDED' }}
          ERROR: ${{ steps.run_research.outcome == 'failure' && 'OIDC prototype research worker failed' || '' }}

      - name: Request fresh OIDC token for browser QA
        id: oidc_qa
        if: always() && steps.claim_research.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=digital-compass-public-runner")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Claim prototype QA tasks
        id: claim_qa
        if: steps.oidc_qa.outcome == 'success'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc_qa.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"action":"claim_prototype_qa"}' \
            "https://xnoalyxxrjyovivdeojo.supabase.co/functions/v1/github-worker-bridge" \
            -o qa-tasks.json
          COUNT="$(python -c 'import json; d=json.load(open("qa-tasks.json")); print(len(d.get("tasks",[])))')"
          COMMAND_ID="$(python -c 'import json; d=json.load(open("qa-tasks.json")); print(d.get("command_id") or "")')"
          echo "Prototype QA tasks: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then echo "has_tasks=true" >> "$GITHUB_OUTPUT"; else echo "has_tasks=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node for browser QA
        if: steps.claim_qa.outputs.has_tasks == 'true' && steps.claim_research.outputs.has_tasks != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        if: steps.claim_qa.outputs.has_tasks == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run prototype browser QA
        id: run_qa
        if: steps.claim_qa.outputs.has_tasks == 'true'
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc_qa.outputs.token }}
          QA_TASK_FILE: qa-tasks.json
        run: node ops/prototype-qa.mjs

      - name: Finalize prototype QA queue command
        if: always() && steps.claim_qa.outputs.command_id != ''
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc_qa.outputs.token }}
          COMMAND_ID: ${{ steps.claim_qa.outputs.command_id }}
          STATUS: ${{ steps.run_qa.outcome == 'failure' && 'FAILED' || 'SUCCEEDED' }}
          ERROR: ${{ steps.run_qa.outcome == 'failure' && 'One or more prototype browser QA tasks failed' || '' }}
          PROCESSED: ${{ steps.run_qa.outputs.processed }}
          FAILURES: ${{ steps.run_qa.outputs.failures }}
        run: |
          set -euo pipefail
          BODY="$(python - <<'PY'
          import json,os
          print(json.dumps({
            'action':'finish_stage_command','command_id':int(os.environ['COMMAND_ID']),
            'command_type':'PROTOTYPE_QA','status':os.environ['STATUS'],
            'result':{'processed':int(os.environ.get('PROCESSED') or 0),'failures':int(os.environ.get('FAILURES') or 0),'worker':'OIDC_PUBLIC_QA'},
            'error_message':os.environ.get('ERROR') or None
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" \
            --data "$BODY" "https://xnoalyxxrjyovivdeojo.supabase.co/functions/v1/github-worker-bridge"

      - name: Fail workflow on worker failure
        if: always()
        shell: bash
        env:
          RESEARCH_OUTCOME: ${{ steps.run_research.outcome }}
          QA_OUTCOME: ${{ steps.run_qa.outcome }}
        run: |
          if [ "${RESEARCH_OUTCOME}" = "failure" ] || [ "${QA_OUTCOME}" = "failure" ]; then
            echo "One or more public operations workers failed."
            exit 1
          fi
