<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Digital Compass — Your Compass for Digital Growth. البوصلة الرقمية — بوصلتك نحو النمو الرقمي.">
<meta name="theme-color" content="#241735">
<title>Digital Compass | البوصلة الرقمية</title>
<style>
:root{--bg:#0d0914;--surface:#171020;--surface2:#21172e;--text:#f8f5fb;--muted:#bdb4c8;--line:#31263d;--primary:#4a3272;--secondary:#241735;--accent:#b99ad9;--radius:28px;--shadow:0 30px 90px rgba(0,0,0,.3)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}a{color:inherit}.shell{max-width:1240px;margin:auto;padding:0 24px}.topbar{position:sticky;top:0;z-index:20;background:rgba(13,9,20,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{height:78px;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:13px;font-weight:900}.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--secondary));position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}.mark:before,.mark:after{content:"";position:absolute;background:#fff;border-radius:999px;transform:rotate(-28deg)}.mark:before{width:31px;height:5px;left:7px;top:14px}.mark:after{width:23px;height:5px;left:13px;top:25px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.navlinks{display:flex;gap:10px}.pill{padding:10px 15px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);font-size:13px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:46px;align-items:center;min-height:calc(100vh - 78px);padding:72px 0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:900}.hero h1{font-size:clamp(48px,7vw,92px);line-height:.98;letter-spacing:-.055em;margin:16px 0 24px}.hero p{font-size:clamp(18px,2vw,22px);line-height:1.8;color:var(--muted);max-width:780px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{padding:15px 20px;border-radius:999px;text-decoration:none;font-weight:900;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent}.btn.primary{background:var(--text);color:var(--bg)}.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--text)}.visual{min-height:540px;position:relative}.orb{position:absolute;border-radius:50%;filter:blur(10px)}.orb.a{width:390px;height:390px;right:2%;top:0;background:radial-gradient(circle at 30% 30%,var(--accent),var(--primary) 45%,transparent 72%);opacity:.52}.orb.b{width:260px;height:260px;left:0;bottom:0;background:radial-gradient(circle,var(--secondary),transparent 68%);opacity:.7}.glass{position:absolute;inset:54px 18px 20px 40px;border:1px solid var(--line);border-radius:38px;background:linear-gradient(155deg,rgba(33,23,46,.84),rgba(23,16,32,.7));backdrop-filter:blur(18px);box-shadow:var(--shadow);padding:30px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.glass:before{content:"";position:absolute;width:390px;height:90px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent);transform:rotate(-32deg);top:48px;left:-90px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:17px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.metric b{display:block;font-size:27px}.metric span{font-size:11px;color:var(--muted)}.section{padding:88px 0;border-top:1px solid var(--line)}.sectionHead{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;align-items:end;margin-bottom:32px}.section h2{font-size:clamp(34px,4.5vw,58px);line-height:1.05;letter-spacing:-.04em;margin:0}.sectionLead{color:var(--muted);line-height:1.8;font-size:18px}.cards,.serviceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.service,.panel{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:27px}.card{min-height:220px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:color-mix(in srgb,var(--primary) 22%,transparent);right:-60px;bottom:-70px}.cardNum,.service small{color:var(--accent);font-size:12px;font-weight:900}.card h3,.service h3{font-size:23px;margin:34px 0 10px}.card p,.panel p{color:var(--muted);line-height:1.75}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:11px 18px;text-align:center;background:#f0c75e;color:#16120a;font-size:13px;font-weight:900}.previewHero{min-height:auto}.previewVisual{min-height:520px;border:1px solid color-mix(in srgb,var(--primary) 42%,var(--line));border-radius:38px;background:linear-gradient(145deg,color-mix(in srgb,var(--primary) 38%,var(--surface)),color-mix(in srgb,var(--secondary) 45%,var(--surface2)));box-shadow:var(--shadow);padding:30px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.previewVisual:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:color-mix(in srgb,var(--accent) 27%,transparent);right:-90px;top:-90px;filter:blur(12px)}.previewVisual h3{font-size:38px;margin:12px 0}.previewVisual p{color:var(--muted);line-height:1.7;max-width:580px}.status{display:inline-flex;margin-top:14px;padding:8px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 13%,transparent);font-size:12px;font-weight:900}.footer{padding:38px 0 58px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.loading,.error{min-height:75vh;display:flex;align-items:center;justify-content:center;padding:38px;text-align:center}.errorBox{max-width:650px;padding:32px;border:1px solid var(--line);border-radius:24px;background:var(--surface)}@media(max-width:900px){.hero,.sectionHead,.split{grid-template-columns:1fr}.visual{min-height:440px}.glass{inset:24px 0}.cards,.serviceGrid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.shell{padding:0 18px}.nav{height:70px}.navlinks{display:none}.hero{padding-top:50px;min-height:auto}.hero h1{font-size:48px}.visual{min-height:360px}.glass{padding:22px}.metrics{grid-template-columns:1fr}.cards,.serviceGrid{grid-template-columns:1fr}.section{padding:66px 0}.previewVisual{min-height:410px}.actions .btn{width:100%}}
</style>
</head>
<body><div id="app"></div>
<script>
const API='https://xnoalyxxrjyovivdeojo.supabase.co/functions/v1/prototype-data';const app=document.getElementById('app');
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function arabic(s){return /[\u0600-\u06FF]/.test(s||'')}function tel(v){return String(v||'').replace(/[^\d+]/g,'')}function wa(v){return String(v||'').replace(/\D/g,'')}
function mix(a,b,t){try{const h=x=>{x=x.replace('#','');if(x.length===3)x=x.split('').map(c=>c+c).join('');return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]};const A=h(a),B=h(b),C=A.map((v,i)=>Math.round(v*(1-t)+B[i]*t));return'#'+C.map(v=>v.toString(16).padStart(2,'0')).join('')}catch{return a}}
function theme(b={}){const r=document.documentElement.style,p=b.primary_color||'#4a3272',s=b.secondary_color||'#241735',a=b.accent_color||'#b99ad9',bg=b.background_color||'#0d0914',tx=b.text_color||'#f8f5fb';r.setProperty('--primary',p);r.setProperty('--secondary',s);r.setProperty('--accent',a);r.setProperty('--bg',bg);r.setProperty('--text',tx);r.setProperty('--surface',mix(bg,tx,.07));r.setProperty('--surface2',mix(bg,p,.15));r.setProperty('--line',mix(bg,tx,.18));r.setProperty('--muted',mix(tx,bg,.34))}
function home(){theme();document.documentElement.lang='ar';document.documentElement.dir='rtl';document.title='Digital Compass | البوصلة الرقمية';return`<div class="topbar"><div class="shell nav"><div class="brand"><div class="mark"></div><div>البوصلة الرقمية<small>Digital Compass</small></div></div><div class="navlinks"><a class="pill" href="#services">الخدمات</a><a class="pill" href="#method">المنهجية</a></div></div></div><main class="shell"><section class="hero"><div><div class="eyebrow">Your Compass for Digital Growth</div><h1>نكتشف أين تضيع فرص النمو، ثم نبني الحل.</h1><p>نساعد الشركات على اكتشاف فجوات النمو الرقمي، وتشخيص أثرها التجاري، وبناء حلول عملية من المواقع إلى أنظمة العملاء والأتمتة والذكاء الاصطناعي.</p><div class="actions"><a class="btn primary" href="#services">استكشف الحلول</a><a class="btn ghost" href="#method">كيف نعمل؟</a></div></div><div class="visual"><div class="orb a"></div><div class="orb b"></div><div class="glass"><div><div class="eyebrow">DISCOVER → DIAGNOSE → BUILD → MEASURE</div><h3 style="font-size:42px;margin:18px 0 8px">Digital Compass</h3><p style="color:var(--muted);line-height:1.75">منصة نمو رقمية مبنية حول المشكلة الفعلية، لا حول بيع خدمات عامة.</p></div><div class="metrics"><div class="metric"><b>01</b><span>Discover</span></div><div class="metric"><b>02</b><span>Diagnose</span></div><div class="metric"><b>03</b><span>Build</span></div></div></div></div></section><section class="section" id="services"><div class="sectionHead"><div><div class="eyebrow">Solutions</div><h2>حلول مبنية على الحاجة.</h2></div><p class="sectionLead">من موقع جديد إلى إصلاح تسريب العملاء أو بناء أتمتة ذكية، نبدأ من المشكلة ونبني فقط ما يحقق قيمة واضحة.</p></div><div class="cards"><article class="card"><div class="cardNum">01</div><h3>Websites & Landing Pages</h3><p>تجربة رقمية احترافية ومقنعة تقود العميل إلى الحجز أو التواصل أو الطلب.</p></article><article class="card"><div class="cardNum">02</div><h3>Lead Systems</h3><p>جمع العملاء المحتملين، تأهيلهم ومتابعتهم بطريقة تقلّل ضياع الفرص.</p></article><article class="card"><div class="cardNum">03</div><h3>AI & Automation</h3><p>أتمتة العمليات المتكررة وبناء مساعدين ذكيين يخدمون النمو والعمليات.</p></article></div></section><section class="section" id="method"><div class="sectionHead"><div><div class="eyebrow">Method</div><h2>اكتشف. شخّص. ابنِ. قِس.</h2></div><p class="sectionLead">منهجية واحدة تربط البحث والتحليل والتنفيذ والقياس، بحيث تتحول كل ملاحظة إلى قرار عملي.</p></div><div class="split"><div class="panel"><h3>من الفرصة إلى الحل</h3><p>نحلل الحضور الرقمي، نحدد التسريب أو الفرصة، ثم نختار الحل الأنسب بدل البدء بقالب مسبق.</p></div><div class="panel"><h3>من الحل إلى نتيجة قابلة للقياس</h3><p>بعد التنفيذ نراقب المؤشرات الأساسية ونطوّر النظام بناءً على بيانات حقيقية.</p></div></div></section></main><footer class="footer"><div class="shell">Digital Compass — Your Compass for Digital Growth / البوصلة الرقمية — بوصلتك نحو النمو الرقمي.</div></footer>`}
function sector(s=''){s=s.toLowerCase();if(s.includes('dental')||s.includes('clinic')||s.includes('health'))return['Care • Trust • Booking','A premium patient journey, before the first appointment.','Services, credibility and booking presented in one calm, confident digital experience.','Clinical precision with a warm, premium feel.'];if(s.includes('education')||s.includes('school'))return['Learning • Registration • Community','A digital campus for families, students and enrollment.','Programs, achievements and registration organized into a clear, trustworthy journey.','Structured, optimistic and family-friendly.'];if(s.includes('auto')||s.includes('repair'))return['Performance • Craft • Service','Built to make automotive expertise feel immediate and credible.','A bold service-first experience for repairs, paint, maintenance and direct enquiries.','Technical, high-contrast and performance driven.'];if(s.includes('cafe')||s.includes('coffee')||s.includes('restaurant'))return['Taste • Place • Experience','Turn the brand atmosphere into a destination customers can enter online.','Story, menu, location and direct actions brought together with a hospitality-first visual system.','Editorial, sensory and location-led.'];return['Presence • Trust • Conversion','A digital experience designed around this business, not a generic template.','A tailored concept that turns the brand, services and contact path into one coherent customer journey.','Custom, conversion-focused and brand-led.']}
function preview(d){const c=d.company||{},x=d.context||{},b=d.client_brand||{},dis=d.disclosure||{};theme(b);const rtl=arabic(c.name);document.documentElement.lang=rtl?'ar':'en';document.documentElement.dir=rtl?'rtl':'ltr';document.title=`${c.name} — Concept Preview`;let m=document.querySelector('meta[name="robots"]');if(!m){m=document.createElement('meta');m.name='robots';document.head.appendChild(m)}m.content='noindex,nofollow,noarchive';const st=sector(c.sector),services=Array.isArray(x.services)?x.services:[],phone=x.contact_phone||c.phone||'',email=x.contact_email||c.general_email||'',ig=x.instagram_url||c.instagram_url||'',fb=x.facebook_url||c.facebook_url||'',actions=[];if(phone){actions.push(`<a class="btn primary" href="tel:${esc(tel(phone))}">Call / اتصال</a>`);actions.push(`<a class="btn ghost" href="https://wa.me/${esc(wa(phone))}" rel="nofollow">WhatsApp</a>`)}else if(email)actions.push(`<a class="btn primary" href="mailto:${esc(email)}">Contact / تواصل</a>`);const socials=[];if(ig)socials.push(`<a class="pill" href="${esc(ig)}" rel="nofollow">Instagram</a>`);if(fb)socials.push(`<a class="pill" href="${esc(fb)}" rel="nofollow">Facebook</a>`);const label=dis.identity_is_official?'Client identity':'Proposed brand direction';return`<div class="notice">UNOFFICIAL CONCEPT PREVIEW BY DIGITAL COMPASS • ${label} • نموذج تصوري غير رسمي</div><div class="topbar"><div class="shell nav"><div class="brand"><div class="mark"></div><div>${esc(c.name)}<small>${esc(c.sector||'Business')} • ${esc(c.country||'')}</small></div></div><div class="navlinks">${socials.join('')}</div></div></div><main class="shell"><section class="hero previewHero"><div><div class="eyebrow">${esc(st[0])}</div><h1>${esc(st[1])}</h1><p>${esc(st[2])}</p><div class="actions">${actions.join('')}</div><span class="status">${esc(label)} • Confidence ${esc(b.confidence_score??'—')}%</span></div><div class="previewVisual"><div class="eyebrow">${esc(st[3])}</div><h3>${esc(c.name)}</h3><p>${esc(b.design_direction||x.validated_summary||'')}</p></div></section><section class="section"><div class="sectionHead"><div><div class="eyebrow">Services / الخدمات</div><h2>What customers should understand in seconds.</h2></div><p class="sectionLead">${esc(x.validated_summary||'')}</p></div><div class="serviceGrid">${(services.length?services:['Services to be confirmed']).slice(0,6).map((s,i)=>`<article class="service"><small>0${i+1}</small><h3>${esc(s)}</h3></article>`).join('')}</div></section><section class="section"><div class="split"><div class="panel"><div class="eyebrow">Brand Direction</div><h2 style="font-size:34px">${esc(b.visual_style||'Tailored visual direction')}</h2><p>${esc(b.tone_of_voice||'')}</p><p><b>Audience:</b> ${esc(b.audience_notes||'')}</p></div><div class="panel"><div class="eyebrow">Contact</div><h2 style="font-size:34px">Find & connect</h2><p>${esc(x.address_text||c.city||c.country||'')}</p><p>${esc(phone)}</p><p>${esc(email)}</p><div class="actions">${actions.join('')}</div></div></div></section></main><footer class="footer"><div class="shell">Concept prepared by Digital Compass. Public information and proposed visual direction must be confirmed by the business before official publication.</div></footer>`}
async function boot(){const slug=location.hash.replace(/^#/,'').trim();if(!slug){app.innerHTML=home();return}if(!/^p-[a-z0-9]{8,30}$/i.test(slug)){app.innerHTML='<div class="error"><div class="errorBox"><h2>Preview not found</h2><p>هذا الرابط غير صالح أو لم يعد متاحاً.</p></div></div>';return}app.innerHTML='<div class="loading"><div><div class="eyebrow">Digital Compass</div><h2>Loading tailored concept…</h2></div></div>';try{const r=await fetch(`${API}?slug=${encodeURIComponent(slug)}`,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error();app.innerHTML=preview(await r.json())}catch{app.innerHTML='<div class="error"><div class="errorBox"><h2>Preview unavailable</h2><p>تعذر تحميل النموذج حالياً. إذا كانت الهوية ما زالت قيد التحليل فلن يظهر النموذج حتى تكتمل بوابة الجودة.</p></div></div>'}}
addEventListener('hashchange',boot);boot();
</script></body></html>
