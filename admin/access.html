<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#251834">
<title>Digital Compass — تسجيل الدخول</title>
<link rel="icon" href="../assets/digital-compass-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{font-family:'IBM Plex Sans Arabic',sans-serif;color:#fff;background:#130d1d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#43326655,transparent 35%),linear-gradient(145deg,#130d1d,#251834)}.card{width:min(520px,100%);background:#21162f;border:1px solid #ffffff18;border-radius:24px;padding:30px;box-shadow:0 30px 80px #0008}.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}.brand img{width:54px;height:54px}.brand span{font-family:Alexandria,sans-serif;font-weight:700;letter-spacing:.08em}.lang{display:flex;gap:8px;justify-content:flex-end;margin-bottom:18px}.lang button{width:auto;margin:0;padding:8px 12px;border-radius:999px;background:#342344;color:#d9caef;border:1px solid #ffffff14;font-size:12px}.lang button.active{background:#fff;color:#251834}h1{font-family:Alexandria,sans-serif;font-size:28px;margin:0 0 10px}p{color:#d8cfe3;line-height:1.8}label{display:block;margin:16px 0 7px;color:#eee}input{width:100%;border:1px solid #ffffff20;background:#160f21;color:#fff;border-radius:12px;padding:14px;font:inherit;outline:none}input:focus{border-color:#8c72bd}button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px 18px;font:600 15px Alexandria,sans-serif;cursor:pointer;background:#fff;color:#251834}button:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:28px;margin-top:15px;color:#d9caef}.ok{color:#a7efbd}.bad{color:#ffb8b8}.small{font-size:13px;color:#bbaecb}.security{display:flex;align-items:center;gap:10px;margin:16px 0 0;padding:12px 14px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff08;color:#cfc1df;font-size:12px}.security i{width:8px;height:8px;border-radius:50%;background:#8fe3ad}.back,.setupLink{display:inline-block;margin-top:16px;color:#cdbce6;font-size:13px}.setupLink{margin-inline-end:16px}.passwordWrap{position:relative}.passwordWrap input{padding-inline-end:72px}.passwordWrap .toggle{position:absolute;inset-inline-end:8px;top:7px;width:auto;margin:0;padding:7px 10px;background:#342344;color:#d9caef;font:500 12px Alexandria,sans-serif}
</style>
</head>
<body>
<main class="card">
<div class="brand"><img src="../assets/digital-compass-logo.svg" alt="Digital Compass"><span>DIGITAL COMPASS</span></div>
<div class="lang"><button type="button" data-lang="ar">العربية</button><button type="button" data-lang="en">EN</button></div>
<h1 id="title">تسجيل الدخول</h1>
<p id="intro">ادخل اسم المستخدم وكلمة المرور. النظام يفتح لك الأقسام حسب صلاحيات حسابك.</p>
<form id="accessForm" novalidate>
<label id="usernameLabel" for="username">اسم المستخدم</label>
<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin" required>
<label id="passwordLabel" for="password">كلمة المرور</label>
<div class="passwordWrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button id="togglePassword" class="toggle" type="button">إظهار</button></div>
<button id="send" type="submit">دخول</button>
</form>
<p id="hint" class="small">يتم التحقق من الحساب ثم تطبيق الصلاحيات الممنوحة له.</p>
<div class="security"><i></i><span id="securityText">الدخول محمي مع Rate Limiting والتحقق من حالة المستخدم قبل فتح Control Center.</span></div>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<a id="setupLink" class="setupLink" href="./credentials.html">إعداد / تغيير بيانات الدخول</a>
<a id="backLink" class="back" href="./">العودة إلى Control Center</a>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const PROJECT_URL='https://xnoalyxxrjyovivdeojo.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_oakIu8ywKQLibfDJUDYIVg_XsNNZi66';
const ACCESS_API=`${PROJECT_URL}/functions/v1/admin-user-api`;
const LOGIN_RESOLVER=`${PROJECT_URL}/functions/v1/admin-login-resolver`;
const supabase=createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s);
let lang=localStorage.getItem('dc_admin_lang')||'ar';
let checking=false;
const copy={
 ar:{title:'تسجيل الدخول',intro:'ادخل اسم المستخدم وكلمة المرور. النظام يفتح لك الأقسام حسب صلاحيات حسابك.',username:'اسم المستخدم',password:'كلمة المرور',send:'دخول',show:'إظهار',hide:'إخفاء',hint:'يتم التحقق من الحساب ثم تطبيق الصلاحيات الممنوحة له.',security:'الدخول محمي مع Rate Limiting والتحقق من حالة المستخدم قبل فتح Control Center.',setup:'إعداد / تغيير بيانات الدخول',back:'العودة إلى Control Center',invalid:'أدخل اسم المستخدم وكلمة المرور.',signing:'جاري التحقق من بيانات الدخول…',bad:'اسم المستخدم أو كلمة المرور غير صحيحة.',checking:'تم تسجيل الدخول. جاري تحميل صلاحيات الحساب…',opening:'تم التحقق من الحساب. جاري فتح Control Center…',unauthorized:'هذا الحساب موقوف أو غير مخول للدخول.',verifyFail:'تعذر التحقق من صلاحية الحساب الآن. حاول مرة أخرى.',setupDone:'تم تحديث بيانات الدخول. سجل دخولك الآن.'},
 en:{title:'Sign in',intro:'Enter your username and password. The system opens modules according to your assigned permissions.',username:'Username',password:'Password',send:'Sign in',show:'Show',hide:'Hide',hint:'Your account is verified before assigned permissions are applied.',security:'Login is protected by rate limiting and active-user verification before Control Center opens.',setup:'Set / change credentials',back:'Back to Control Center',invalid:'Enter your username and password.',signing:'Checking your credentials…',bad:'Incorrect username or password.',checking:'Signed in. Loading account permissions…',opening:'Account verified. Opening Control Center…',unauthorized:'This account is inactive or not authorized.',verifyFail:'Account authorization could not be verified right now. Try again.',setupDone:'Credentials updated. Sign in with your username and password.'}
};
function applyLang(){const c=copy[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.dir=document.documentElement.dir;$('#title').textContent=c.title;$('#intro').textContent=c.intro;$('#usernameLabel').textContent=c.username;$('#passwordLabel').textContent=c.password;$('#send').textContent=c.send;$('#hint').textContent=c.hint;$('#securityText').textContent=c.security;$('#setupLink').textContent=c.setup;$('#backLink').textContent=c.back;$('#togglePassword').textContent=$('#password').type==='password'?c.show:c.hide;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
function setMessage(text,cls=''){const el=$('#message');el.textContent=text;el.className='msg '+cls}
async function verifyAccess(session){const url=new URL(ACCESS_API);url.searchParams.set('action','current');try{const r=await fetch(url,{headers:{apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${session.access_token}`,Accept:'application/json'},cache:'no-store'});if(r.ok)return true;if(r.status===401||r.status===403)return false;throw new Error(`HTTP_${r.status}`)}catch(e){if(String(e.message||'').startsWith('HTTP_'))throw e;throw new Error('VERIFY_NETWORK')}}
async function resolveLogin(username,password){const r=await fetch(LOGIN_RESOLVER,{method:'POST',headers:{apikey:PUBLISHABLE_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({username,password}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.token_hash)throw new Error('BAD_CREDENTIALS');return String(d.token_hash)}
async function goIfSignedIn(){if(checking)return false;checking=true;try{const {data}=await supabase.auth.getSession();const s=data.session;if(!s)return false;setMessage(copy[lang].checking);if(!(await verifyAccess(s))){await supabase.auth.signOut();setMessage(copy[lang].unauthorized,'bad');return false}setMessage(copy[lang].opening,'ok');setTimeout(()=>location.replace('./'),300);return true}catch{setMessage(copy[lang].verifyFail,'bad');return false}finally{checking=false}}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('dc_admin_lang',lang);applyLang()}));
$('#togglePassword').addEventListener('click',()=>{const p=$('#password');p.type=p.type==='password'?'text':'password';applyLang()});
$('#accessForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('#username').value.trim();const password=$('#password').value;const c=copy[lang];if(!username||!password){setMessage(c.invalid,'bad');return}const button=$('#send');button.disabled=true;setMessage(c.signing);try{const tokenHash=await resolveLogin(username,password);const {data,error}=await supabase.auth.verifyOtp({token_hash:tokenHash,type:'email'});if(error||!data.session)throw new Error('BAD_CREDENTIALS');setMessage(c.checking);if(!(await verifyAccess(data.session))){await supabase.auth.signOut();setMessage(c.unauthorized,'bad');return}setMessage(c.opening,'ok');setTimeout(()=>location.replace('./'),300)}catch{await supabase.auth.signOut().catch(()=>{});setMessage(c.bad,'bad')}finally{button.disabled=false}});
applyLang();if(new URL(location.href).searchParams.get('setup')==='done')setMessage(copy[lang].setupDone,'ok');await goIfSignedIn();supabase.auth.onAuthStateChange((_event,s)=>{if(s)queueMicrotask(()=>goIfSignedIn())});
</script>
</body>
</html>
