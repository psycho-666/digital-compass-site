<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#251834">
<title>Digital Compass Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./admin.css">
<link rel="stylesheet" href="./admin-extra.css">
<link rel="stylesheet" href="./assistant-ui.css">
</head>
<body>
<div id="authView" class="authView">
  <div class="authArt"><img src="../assets/digital-compass-logo.svg" alt="Digital Compass"><div class="orb"></div><div class="authStatement"><span>CONTROL CENTER</span><h1>Digital Compass<br>Operating System</h1><p id="authIntro">لوحة واحدة لاكتشاف الفرص، تدقيقها، بناء النماذج، ومتابعة التواصل.</p></div></div>
  <div class="authPanel">
    <div class="language"><button data-lang="ar" class="active">العربية</button><button data-lang="en">EN</button></div>
    <div class="authCard">
      <div class="authTabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="setupTab">الإعداد الأول</button></div>
      <form id="loginForm" class="form active">
        <label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="username" required></label>
        <label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" minlength="12" required></label>
        <button class="primary" type="submit">دخول إلى النظام</button>
      </form>
      <form id="setupForm" class="form">
        <p class="formHint">يُستخدم مرة واحدة فقط لإنشاء حساب مالك النظام.</p>
        <label>رمز الإعداد<input id="setupCode" type="password" autocomplete="one-time-code" required></label>
        <label>البريد الإلكتروني<input id="setupEmail" type="email" autocomplete="username" required></label>
        <label>كلمة مرور جديدة<input id="setupPassword" type="password" autocomplete="new-password" minlength="12" required></label>
        <button class="primary" type="submit">إنشاء حساب المالك</button>
      </form>
      <div id="authMessage" class="message"></div>
    </div>
  </div>
</div>

<div id="appView" class="appView hidden">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/digital-compass-logo.svg" alt="Digital Compass"><span>CONTROL CENTER</span></div>
    <nav id="nav">
      <button class="navItem active" data-view="overview"><b>01</b><span>نظرة عامة</span></button>
      <button class="navItem" data-view="leads"><b>02</b><span>الفرص والعملاء</span></button>
      <a class="navItem" href="./social.html"><b>03</b><span>السوشيال — العراق</span></a>
      <button class="navItem" data-view="prototypes"><b>04</b><span>النماذج</span></button>
      <button class="navItem" data-view="outreach"><b>05</b><span>التواصل</span></button>
      <button class="navItem" data-view="automation"><b>06</b><span>الأتمتة</span></button>
      <button class="navItem" data-view="settings"><b>07</b><span>الإعدادات</span></button>
    </nav>
    <div class="sidebarFoot"><div class="liveDot"><i></i><span>System online</span></div><button id="logoutBtn">تسجيل الخروج</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><span class="eyebrow">DIGITAL COMPASS / OPS</span><h1 id="viewTitle">نظرة عامة</h1></div><div class="topActions"><div class="language"><button data-lang="ar" class="active">العربية</button><button data-lang="en">EN</button></div><button id="refreshBtn" class="iconBtn" title="Refresh">↻</button></div></header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="drawer" class="drawer hidden" aria-hidden="true"><div class="drawerBackdrop" data-close-drawer></div><div class="drawerPanel"><button class="drawerClose" data-close-drawer>×</button><div id="drawerContent"></div></div></div>
<div id="toast" class="toast"></div>
<script type="module" src="./admin.js"></script>
<script type="module" src="./view-router.js"></script>
<script type="module" src="./assistant-ui.js"></script>
</body>
</html>
