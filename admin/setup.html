<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#251834">
<title>Digital Compass — إعداد المالك</title>
<link rel="icon" href="../assets/digital-compass-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{font-family:'IBM Plex Sans Arabic',sans-serif;color:#fff;background:#130d1d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#43326655,transparent 35%),linear-gradient(145deg,#130d1d,#251834)}.card{width:min(520px,100%);background:#21162f;border:1px solid #ffffff18;border-radius:24px;padding:30px;box-shadow:0 30px 80px #0008}.brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.brand img{width:54px;height:54px}.brand span{font-family:Alexandria,sans-serif;font-weight:700;letter-spacing:.08em}h1{font-family:Alexandria,sans-serif;font-size:28px;margin:0 0 10px}p{color:#d8cfe3;line-height:1.8}.step{margin-top:22px;padding-top:22px;border-top:1px solid #ffffff14}label{display:block;margin:14px 0 8px;color:#eee}input{width:100%;border:1px solid #ffffff20;background:#160f21;color:#fff;border-radius:12px;padding:14px;font:inherit;outline:none}input:focus{border-color:#8c72bd}button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px 18px;font:600 15px Alexandria,sans-serif;cursor:pointer;background:#fff;color:#251834}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#433266;color:#fff}.msg{min-height:26px;margin-top:14px;color:#d9caef}.ok{color:#a7efbd}.bad{color:#ffb8b8}.hidden{display:none}.small{font-size:13px;color:#bbaecb}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="../assets/digital-compass-logo.svg" alt="Digital Compass"><span>DIGITAL COMPASS</span></div>
  <h1>إعداد حساب المالك</h1>
  <p>هذه الصفحة تُستخدم مرة واحدة فقط. التحقق يتم عبر رابط آمن يُرسل من Supabase إلى بريد المالك المعتمد.</p>

  <section id="requestStep" class="step">
    <label for="email">بريد المالك</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
    <button id="sendLink" type="button">إرسال رابط التحقق</button>
    <p class="small">افتح الرسالة على نفس الجهاز إن أمكن، واضغط رابط التحقق. سترجع إلى هذه الصفحة تلقائيًا.</p>
  </section>

  <section id="finishStep" class="step hidden">
    <p class="ok">✓ تم التحقق من البريد بنجاح.</p>
    <label for="password">كلمة مرور جديدة</label>
    <input id="password" type="password" minlength="12" autocomplete="new-password" placeholder="12 حرفًا على الأقل">
    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password">
    <button id="finish" type="button">إنشاء حساب المالك والدخول</button>
  </section>
  <div id="message" class="msg"></div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const PROJECT_URL='https://xnoalyxxrjyovivdeojo.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_oakIu8ywKQLibfDJUDYIVg_XsNNZi66';
const BOOTSTRAP=`${PROJECT_URL}/functions/v1/admin-bootstrap`;
const supabase=createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s);const msg=(t,c='')=>{$('#message').textContent=t;$('#message').className='msg '+c};
async function refresh(){const {data}=await supabase.auth.getSession();const session=data.session;if(session){$('#requestStep').classList.add('hidden');$('#finishStep').classList.remove('hidden');msg(`تم التحقق من ${session.user.email}`,'ok')}else{$('#requestStep').classList.remove('hidden');$('#finishStep').classList.add('hidden')}}
$('#sendLink').onclick=async()=>{const email=$('#email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email)){msg('أدخل بريدًا صحيحًا.','bad');return}const b=$('#sendLink');b.disabled=true;msg('جاري إرسال رابط التحقق…');try{const redirect=`${location.origin}${location.pathname}`;const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:redirect,shouldCreateUser:true}});if(error)throw error;msg('تم إرسال رابط التحقق. افتح بريدك واضغط الرابط.','ok')}catch(e){msg('تعذر إرسال رابط التحقق الآن. حاول مرة أخرى.','bad')}finally{b.disabled=false}};
$('#finish').onclick=async()=>{const p=$('#password').value,c=$('#confirmPassword').value;if(p.length<12){msg('كلمة المرور يجب أن تكون 12 حرفًا على الأقل.','bad');return}if(p!==c){msg('كلمتا المرور غير متطابقتين.','bad');return}const {data}=await supabase.auth.getSession();const session=data.session;if(!session){msg('جلسة التحقق غير موجودة. أرسل رابط تحقق جديد.','bad');await refresh();return}const b=$('#finish');b.disabled=true;msg('جاري إنشاء حساب المالك…');try{const r=await fetch(BOOTSTRAP,{method:'POST',headers:{apikey:PUBLISHABLE_KEY,Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({action:'finalize_owner',password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP_${r.status}`);msg('تم إنشاء حساب المالك. جاري فتح Control Center…','ok');setTimeout(()=>location.replace('./'),900)}catch(e){const m={already_initialized:'تم إعداد حساب المالك مسبقًا. استخدم تسجيل الدخول.',email_not_authorized:'هذا البريد غير مخول كمالك.',invalid_input:'كلمة المرور غير صالحة.',session_invalid:'جلسة التحقق غير صالحة أو انتهت.'};msg(m[e.message]||'تعذر إكمال إنشاء الحساب.','bad')}finally{b.disabled=false}};
await refresh();supabase.auth.onAuthStateChange(()=>refresh());
</script>
</body>
</html>
