<style>
:root{--bg:#0d0d12;--surface:#15141b;--surface2:#1d1b24;--text:#f7f5fa;--muted:#aca6b5;--line:rgba(255,255,255,.11);--primary:#4a3272;--secondary:#241735;--accent:#c6a9e6;--font-head:'IBM Plex Sans Arabic',sans-serif;--font-body:'IBM Plex Sans Arabic',sans-serif;--font-en:'Manrope',sans-serif;--radius:26px;--shadow:0 28px 90px rgba(0,0,0,.18)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden}body.en{font-family:var(--font-en)}a{color:inherit}.wrap{width:min(1240px,calc(100% - 40px));margin:auto}.lang{position:fixed;z-index:80;top:18px;left:18px;border:1px solid var(--line);background:rgba(10,10,14,.72);backdrop-filter:blur(16px);color:#fff;border-radius:999px;padding:10px 14px;font:700 12px var(--font-en);cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.14)}.concept{position:relative;z-index:70;text-align:center;padding:9px 52px;background:#f1c85b;color:#201a0c;font-size:11px;font-weight:800;letter-spacing:.02em}.nav{height:86px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:relative;z-index:30}.wordmark{font-family:var(--font-head);font-weight:800;letter-spacing:-.03em;max-width:70%}.wordmark small{display:block;font:600 11px var(--font-en);color:var(--muted);letter-spacing:.08em;margin-top:5px}.navActions{display:flex;gap:9px;align-items:center}.mini{border:1px solid var(--line);border-radius:999px;padding:9px 13px;text-decoration:none;font-size:12px;color:var(--muted);transition:.25s}.mini:hover{color:var(--text);transform:translateY(-2px)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 20px;border-radius:999px;text-decoration:none;font-weight:800;border:1px solid transparent;transition:.25s}.btn:hover{transform:translateY(-2px)}.btn.light{background:var(--text);color:var(--bg)}.btn.outline{border-color:var(--line);background:transparent}.eyebrow{font:800 11px var(--font-en);text-transform:uppercase;letter-spacing:.17em;color:var(--accent)}.big{font-family:var(--font-head);font-size:clamp(48px,7.2vw,102px);line-height:1.02;letter-spacing:-.055em;margin:14px 0 22px}.lead{font-size:clamp(17px,1.8vw,21px);line-height:1.85;color:var(--muted);max-width:760px}.actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:28px}.section{padding:88px 0}.divider{border-top:1px solid var(--line)}.sectionTitle{font-family:var(--font-head);font-size:clamp(34px,4.5vw,62px);line-height:1.12;letter-spacing:-.04em;margin:10px 0 18px}.muted{color:var(--muted);line-height:1.8}.footer{padding:38px 0 60px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.reveal{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
/* Digital Compass home */
.dc{--bg:#0d0c11;--surface:#18141d;--surface2:#211a2a;--text:#faf8fc;--muted:#b7afc2;--primary:#4a3272;--secondary:#241735;--accent:#c6a9e6;--font-head:'IBM Plex Sans Arabic',sans-serif;--font-body:'IBM Plex Sans Arabic',sans-serif}.dcHero{min-height:calc(100vh - 86px);display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:60px;padding:70px 0}.dcArt{height:580px;position:relative}.dcDisc{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.13)}.dcDisc.a{width:440px;height:440px;inset:55px 30px auto auto;background:radial-gradient(circle at 35% 30%,rgba(198,169,230,.38),rgba(74,50,114,.14) 50%,transparent 71%)}.dcDisc.b{width:280px;height:280px;left:0;bottom:20px;background:rgba(74,50,114,.18)}.dcNeedle{position:absolute;width:390px;height:72px;right:45px;top:235px;background:linear-gradient(90deg,transparent,var(--accent),#fff);clip-path:polygon(0 45%,88% 0,100% 50%,88% 100%,0 55%);transform:rotate(-28deg);filter:drop-shadow(0 16px 28px rgba(198,169,230,.2))}.dcIndex{position:absolute;bottom:40px;right:30px;left:55px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.dcIndex span{border-top:1px solid var(--line);padding-top:12px;font:700 11px var(--font-en);color:var(--muted)}.dcGrid{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:14px}.dcCard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;min-height:250px}.dcCard:first-child{background:linear-gradient(145deg,#241735,#4a3272)}
/* Clinic */
.clinic{--bg:#fcfbf8;--surface:#f2f5f2;--surface2:#e7f4f2;--text:#172126;--muted:#627174;--primary:#0f5f5b;--secondary:#e7f4f2;--accent:#c9a46a;--line:rgba(23,33,38,.13);--font-head:'Alexandria',sans-serif;--font-body:'IBM Plex Sans Arabic',sans-serif}.clinic .lang{background:rgba(15,95,91,.88)}.clinic .concept{background:#183735;color:#fff}.clinicHero{min-height:720px;display:grid;grid-template-columns:1.02fr .98fr;gap:54px;align-items:center;padding:68px 0 78px}.clinicVisual{height:590px;position:relative;border-radius:44px;background:linear-gradient(145deg,#dcefeb,#f8f4e9);overflow:hidden;box-shadow:var(--shadow)}.clinicVisual:after{content:"";position:absolute;width:370px;height:370px;border-radius:50%;background:#0f5f5b;opacity:.12;left:-90px;bottom:-110px}.tooth{position:absolute;inset:60px 72px 120px 72px;display:grid;place-items:center}.tooth svg{width:76%;height:76%;stroke:#0f5f5b;stroke-width:1.6;fill:none;opacity:.88;filter:drop-shadow(0 15px 35px rgba(15,95,91,.12))}.clinicFloat{position:absolute;right:28px;bottom:28px;width:min(360px,calc(100% - 56px));background:rgba(252,251,248,.9);backdrop-filter:blur(18px);border:1px solid rgba(15,95,91,.16);border-radius:24px;padding:22px}.clinicFloat b{font-family:var(--font-head);display:block;font-size:18px;margin-bottom:7px}.clinicStrip{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.clinicStrip div{padding:24px 16px;text-align:center;border-left:1px solid var(--line);font-weight:700;font-size:13px}.clinicStrip div:last-child{border-left:0}.clinicStory{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px}.clinicQuote{font-family:var(--font-head);font-size:clamp(34px,4.4vw,62px);line-height:1.35;color:var(--primary)}.clinicList{display:grid;gap:12px}.clinicItem{display:grid;grid-template-columns:54px 1fr;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}.clinicItem .num{font:700 12px var(--font-en);color:var(--accent)}.clinicItem h3{font-family:var(--font-head);font-size:21px;margin:0 0 5px}.clinicCta{margin:20px 0 90px;border-radius:36px;background:#0f5f5b;color:#fff;padding:44px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}.clinicCta .muted{color:rgba(255,255,255,.72)}
/* School */
.school{--bg:#fbfcfe;--surface:#f1f4f8;--surface2:#f4f0e6;--text:#172338;--muted:#667287;--primary:#183a63;--secondary:#f4f0e6;--accent:#b9913b;--line:rgba(23,35,56,.14);--font-head:'Noto Kufi Arabic',sans-serif;--font-body:'IBM Plex Sans Arabic',sans-serif}.school .lang{background:rgba(24,58,99,.92)}.school .concept{background:#183a63;color:#fff}.schoolHero{padding:70px 0 58px;display:grid;grid-template-columns:1.2fr .8fr;gap:42px;align-items:end}.schoolHero .big{font-size:clamp(45px,6vw,82px);line-height:1.25}.schoolSeal{height:470px;border-radius:48% 48% 30px 30px;background:var(--primary);color:#fff;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:36px}.schoolSeal:before{content:"";position:absolute;inset:28px;border:1px solid rgba(255,255,255,.25);border-radius:46% 46% 24px 24px}.schoolSeal:after{content:"";position:absolute;width:230px;height:230px;border:45px double rgba(185,145,59,.35);border-radius:50%;top:58px;left:50%;transform:translateX(-50%)}.schoolSeal strong{font-family:var(--font-head);font-size:25px;position:relative;z-index:2}.schoolBands{display:grid;grid-template-columns:1fr 1fr;margin:20px 0 0}.schoolBand{padding:34px;background:var(--primary);color:#fff}.schoolBand.alt{background:var(--secondary);color:var(--text)}.schoolBand small{font:700 11px var(--font-en);letter-spacing:.13em}.schoolBand h3{font-family:var(--font-head);font-size:28px;margin:18px 0 5px}.academicPath{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.pathStep{padding:32px 24px;min-height:230px;border-left:1px solid var(--line)}.pathStep:last-child{border-left:0}.pathStep span{font:800 12px var(--font-en);color:var(--accent)}.pathStep h3{font-family:var(--font-head);font-size:21px;line-height:1.6;margin:42px 0 10px}.schoolInfo{display:grid;grid-template-columns:.95fr 1.05fr;gap:18px}.schoolPanel{border-radius:28px;padding:34px;background:var(--surface)}.schoolPanel.gold{background:var(--secondary)}.schoolCta{background:var(--primary);color:white;margin:20px 0 90px;border-radius:30px;padding:40px;display:flex;align-items:center;justify-content:space-between;gap:28px}.schoolCta .muted{color:rgba(255,255,255,.72)}
/* Automotive */
.auto{--bg:#0b1015;--surface:#111922;--surface2:#17212b;--text:#f4f7fa;--muted:#8e9aa6;--primary:#101820;--secondary:#e8edf2;--accent:#2f80ed;--line:rgba(255,255,255,.11);--font-head:'Changa',sans-serif;--font-body:'IBM Plex Sans Arabic',sans-serif}.auto .lang{background:rgba(16,24,32,.9)}.auto .concept{background:#2f80ed;color:#fff}.auto .nav{border-color:rgba(255,255,255,.1)}.autoHero{min-height:730px;position:relative;display:grid;grid-template-columns:1fr .92fr;gap:50px;align-items:center;padding:62px 0 72px}.autoHero:before{content:"";position:absolute;width:58vw;height:100%;right:47%;top:0;background:linear-gradient(130deg,transparent 12%,rgba(47,128,237,.12) 12% 15%,transparent 15% 31%,rgba(255,255,255,.035) 31% 58%,transparent 58%);pointer-events:none}.autoHero .big{text-transform:none;font-size:clamp(52px,7vw,96px);line-height:1.08}.carStage{height:520px;position:relative;display:grid;place-items:center}.carStage:before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(47,128,237,.24),rgba(47,128,237,.05) 48%,transparent 70%)}.carStage svg{position:relative;width:95%;stroke:#f4f7fa;fill:none;stroke-width:1.5;filter:drop-shadow(0 20px 45px rgba(47,128,237,.15))}.scan{position:absolute;width:80%;height:1px;background:linear-gradient(90deg,transparent,#2f80ed,transparent);animation:scan 3.5s linear infinite}@keyframes scan{0%{top:28%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:72%;opacity:0}}.autoServices{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.autoService{border:1px solid var(--line);min-height:260px;padding:24px;position:relative;overflow:hidden;transition:.3s}.autoService:hover{background:#101a24;transform:translateY(-5px);border-color:rgba(47,128,237,.45)}.autoService:after{content:"";position:absolute;width:100px;height:6px;background:var(--accent);right:-25px;bottom:20px;transform:rotate(-35deg)}.autoService span{font:800 12px var(--font-en);color:var(--accent)}.autoService h3{font-family:var(--font-head);font-size:22px;line-height:1.45;margin:80px 0 0}.autoProof{display:grid;grid-template-columns:.8fr 1.2fr;gap:50px;align-items:start}.techBox{border:1px solid var(--line);padding:28px;background:linear-gradient(145deg,#111922,#0d141b)}.techBox h3{font-family:var(--font-head);font-size:28px;margin:0 0 12px}.autoCta{margin:20px 0 90px;padding:44px;background:#2f80ed;color:#fff;clip-path:polygon(0 0,96% 0,100% 22%,100% 100%,4% 100%,0 78%);display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}.autoCta .muted{color:rgba(255,255,255,.75)}
.loading,.error{min-height:72vh;display:grid;place-items:center;text-align:center;padding:40px}.errorBox{max-width:650px;border:1px solid var(--line);border-radius:28px;padding:34px;background:var(--surface)}
@media(max-width:900px){.dcHero,.clinicHero,.schoolHero,.autoHero,.clinicStory,.clinicCta,.schoolInfo,.autoProof,.autoCta{grid-template-columns:1fr}.dcArt,.clinicVisual,.carStage{height:440px}.dcGrid{grid-template-columns:1fr}.clinicStrip,.autoServices{grid-template-columns:repeat(2,1fr)}.academicPath{grid-template-columns:1fr 1fr}.schoolSeal{height:400px}.schoolCta{align-items:flex-start;flex-direction:column}}@media(max-width:620px){.wrap{width:min(100% - 30px,1240px)}.concept{padding-left:70px;font-size:9px}.nav{height:76px}.navActions .mini:not(:last-child){display:none}.wordmark{max-width:72%;font-size:14px}.big{font-size:44px}.dcHero,.clinicHero,.schoolHero,.autoHero{padding-top:48px;min-height:auto}.dcArt{height:340px}.dcDisc.a{width:290px;height:290px}.dcNeedle{width:270px;top:145px;right:8px}.dcIndex{display:none}.clinicVisual,.carStage{height:360px}.clinicStrip,.autoServices,.academicPath{grid-template-columns:1fr}.clinicStrip div,.pathStep,.autoService{border-left:0;border-bottom:1px solid var(--line)}.clinicCta,.schoolCta,.autoCta{margin-bottom:60px;padding:28px}.section{padding:64px 0}.actions .btn{width:100%}.schoolBands{grid-template-columns:1fr}.schoolSeal{height:330px}.autoCta{clip-path:none;border-radius:24px}.lang{top:14px;left:12px}}

<script>
const API='https://xnoalyxxrjyovivdeojo.supabase.co/functions/v1/prototype-data';
const app=document.getElementById('app');let currentData=null;let LANG=localStorage.getItem('dc_lang')||'ar';
const tr=(ar,en)=>LANG==='ar'?ar:en;
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function digits(v){return String(v||'').replace(/\D/g,'')}
function tel(v){return String(v||'').replace(/[^\d+]/g,'')}
function setLang(l){LANG=l;localStorage.setItem('dc_lang',l);render()}
function langButton(){return `<button class="lang" onclick="setLang('${LANG==='ar'?'en':'ar'}')">${LANG==='ar'?'EN':'العربية'}</button>`}
function setupDoc(cls,title){document.body.className=cls+(LANG==='en'?' en':'');document.documentElement.dir=LANG==='ar'?'rtl':'ltr';document.documentElement.lang=LANG;document.title=title}
const serviceAR={'Dental care':'العناية بالأسنان','Dental implants':'زراعة الأسنان','Aesthetic dental services':'تجميل الأسنان','Cosmetic treatments':'علاجات تجميلية','Appointment booking':'حجز المواعيد','Secondary education':'التعليم الثانوي','Student registration':'تسجيل الطلبة','Academic follow-up':'المتابعة الأكاديمية','Private schooling':'التعليم الأهلي','Automobile repair':'تصليح السيارات','Vehicle painting':'صبغ السيارات','Bodywork':'أعمال الهيكل والبودي','Car maintenance':'صيانة السيارات','Auto detailing':'العناية والتفصيل'};
function services(x){const a=Array.isArray(x?.services)?x.services:[];return a.map(s=>LANG==='ar'?(serviceAR[s]||s):s)}
function contactActions(c,x,dark=false){const phone=x?.contact_phone||c.phone||'';const email=x?.contact_email||c.general_email||'';let a=[];if(phone){a.push(`<a class="btn light" href="tel:${esc(tel(phone))}">${tr('اتصل الآن','Call now')}</a>`);a.push(`<a class="btn outline" href="https://wa.me/${esc(digits(phone))}" rel="nofollow">WhatsApp</a>`)}else if(email)a.push(`<a class="btn light" href="mailto:${esc(email)}">${tr('تواصل معنا','Contact')}</a>`);return a.join('')}
function disclosure(d){return `<div class="concept">${tr('نموذج تصوري غير رسمي • الاتجاه البصري مقترح ويحتاج اعتماد النشاط','UNOFFICIAL CONCEPT PREVIEW • PROPOSED VISUAL DIRECTION')}</div>`}
function svgTooth(){return `<svg viewBox="0 0 420 420" aria-hidden="true"><path d="M124 54c-42 9-66 49-62 95 5 57 34 76 45 131 8 41 13 82 35 82 26 0 25-69 68-69s42 69 68 69c22 0 27-41 35-82 11-55 40-74 45-131 4-46-20-86-62-95-35-8-56 17-86 17s-51-25-86-17Z"/><path d="M126 101c27 13 55 18 84 18s57-5 84-18"/><path d="M210 119v124"/></svg>`}
function svgCar(){return `<svg viewBox="0 0 760 340" aria-hidden="true"><path d="M72 230h52l32-76c12-28 31-46 61-51l178-29c43-7 70 1 102 29l66 58 81 23c26 8 42 25 45 46l3 20h-55"/><path d="M210 230h286"/><circle cx="165" cy="236" r="48"/><circle cx="553" cy="236" r="48"/><path d="M215 103l45 74h213l-66-90"/><path d="M276 101l29 76M411 84l19 93"/></svg>`}
function nav(c,cls=''){const ig=c.instagram_url?`<a class="mini" href="${esc(c.instagram_url)}" rel="nofollow">Instagram</a>`:'';return `<div class="wrap nav"><div class="wordmark">${esc(c.name)}<small>${esc(c.sector||'')} · ${esc(c.country||'')}</small></div><div class="navActions">${ig}</div></div>`}
function home(){setupDoc('dc','Digital Compass | البوصلة الرقمية');return `${langButton()}<div class="wrap">${nav({name:tr('البوصلة الرقمية','Digital Compass'),sector:'Digital Growth',country:'Iraq'})}<section class="dcHero"><div class="reveal"><div class="eyebrow">DISCOVER · DIAGNOSE · BUILD · MEASURE</div><h1 class="big">${tr('نكتشف أين تضيع فرص النمو، ثم نبني الحل.','We find where growth is leaking — then build the fix.')}</h1><p class="lead">${tr('البوصلة الرقمية تساعد الشركات على اكتشاف الفرص الخفية، تشخيص ما يعيق التقدم، وبناء حلول رقمية عملية تقود إلى نتيجة واضحة.','Digital Compass helps businesses uncover hidden opportunities, diagnose friction and build practical digital systems that move growth forward.')}</p><div class="actions"><a class="btn light" href="#services">${tr('استكشف الحلول','Explore solutions')}</a></div></div><div class="dcArt reveal d1"><div class="dcDisc a"></div><div class="dcDisc b"></div><div class="dcNeedle"></div><div class="dcIndex"><span>01 DISCOVER</span><span>02 DIAGNOSE</span><span>03 BUILD</span><span>04 MEASURE</span></div></div></section><section class="section divider" id="services"><div class="eyebrow">${tr('من المشكلة إلى الحل','FROM GAP TO GROWTH')}</div><h2 class="sectionTitle">${tr('مو خدمات جاهزة. حلول مبنية على الحاجة.','Not a service menu. A solution built around the need.')}</h2><div class="dcGrid"><article class="dcCard"><div class="eyebrow">01</div><h3 class="sectionTitle" style="font-size:34px">Websites & Landing Pages</h3><p class="muted">${tr('واجهات مقنعة مبنية لتحويل الانتباه إلى تواصل وحجز وطلب.','Conversion-minded web experiences built around clarity and action.')}</p></article><article class="dcCard"><div class="eyebrow">02</div><h3>Lead Systems</h3><p class="muted">${tr('تنظيم الفرص والمتابعة وتقليل ضياع العملاء المحتملين.','Capture, organize and follow up on opportunities.')}</p></article><article class="dcCard"><div class="eyebrow">03</div><h3>AI & Automation</h3><p class="muted">${tr('أتمتة عمليات متكررة ومساعدين أذكياء يخدمون النمو.','Automate repetitive work and add intelligent business assistance.')}</p></article></div></section></div><footer class="footer"><div class="wrap">Digital Compass — Your Compass for Digital Growth.</div></footer>`}
function clinic(data){const c=data.company,x=data.context,s=services(x),phone=x.contact_phone||c.phone||'',address=x.address_text||c.country;setupDoc('clinic',c.name);return `${langButton()}${disclosure(data.disclosure)}${nav(c)}<main><div class="wrap"><section class="clinicHero"><div class="reveal"><div class="eyebrow">${tr('عناية · ثقة · حجز','CARE · TRUST · BOOKING')}</div><h1 class="big">${tr('ثقة تبدأ قبل الموعد.','Confidence starts before the appointment.')}</h1><p class="lead">${tr('تجربة رقمية هادئة وواضحة لعرض خدمات الأسنان والتجميل، بناء الثقة، والوصول للحجز بأقل خطوات ممكنة.','A calm, refined digital experience for dental and aesthetic care, designed around trust and frictionless booking.')}</p><div class="actions">${contactActions(c,x)}</div></div><div class="clinicVisual reveal d1"><div class="tooth">${svgTooth()}</div><div class="clinicFloat"><b>${esc(c.name)}</b><span class="muted">${esc(address)}</span></div></div></section></div><div class="clinicStrip">${s.slice(0,5).map(v=>`<div>${esc(v)}</div>`).join('')}</div><section class="section"><div class="wrap clinicStory"><div><div class="eyebrow">${tr('التجربة المقترحة','PROPOSED EXPERIENCE')}</div><div class="clinicQuote">${tr('وضوح طبي بطابع جمالي راقٍ.','Clinical clarity with aesthetic refinement.')}</div></div><div class="clinicList">${s.map((v,i)=>`<div class="clinicItem"><div class="num">0${i+1}</div><div><h3>${esc(v)}</h3><p class="muted">${tr('مسار واضح للخدمة مع دعوة مباشرة للحجز والتواصل.','A clear service path with direct booking and contact actions.')}</p></div></div>`).join('')}</div></div></section><div class="wrap"><section class="clinicCta"><div><div class="eyebrow" style="color:#d7c08e">${tr('حجز وتواصل','BOOKING & CONTACT')}</div><h2 class="sectionTitle" style="color:#fff">${tr('خلّي الخطوة التالية بسيطة.','Make the next step effortless.')}</h2><p class="muted">${esc(phone)}<br>${esc(address)}</p></div><div class="actions">${contactActions(c,x,true)}</div></section></div></main><footer class="footer"><div class="wrap">${tr('نموذج تصوري من Digital Compass. المعلومات العامة تحتاج تأكيد النشاط قبل النشر الرسمي.','Concept by Digital Compass. Public information must be confirmed before official publication.')}</div></footer>`}
function school(data){const c=data.company,x=data.context,s=services(x),address=x.address_text||c.country;setupDoc('school',c.name);const boys=tr('ثانوية الرحمن الأهلية للبنين','Al-Rahman Private Secondary School for Boys'),girls=tr('ثانوية الياقوت الأهلية للبنات','Al-Yaqout Private Secondary School for Girls');return `${langButton()}${disclosure(data.disclosure)}${nav(c)}<main><div class="wrap"><section class="schoolHero"><div class="reveal"><div class="eyebrow">${tr('تعليم · متابعة · تسجيل','EDUCATION · FOLLOW-UP · REGISTRATION')}</div><h1 class="big">${tr('بيئة تعليمية تُفهم من أول نظرة.','An academic experience families can understand at first glance.')}</h1><p class="lead">${tr('تصور رقمي يضع الثقة، المتابعة الأكاديمية ومعلومات التسجيل في مسار واضح للأهل والطلبة.','A proposed digital experience that organizes academic trust, follow-up and registration information for families and students.')}</p><div class="actions">${contactActions(c,x)}</div></div><div class="schoolSeal reveal d1"><strong>${tr('تعليم أهلي · النجف','PRIVATE EDUCATION · NAJAF')}</strong></div></section><div class="schoolBands"><div class="schoolBand"><small>BOYS</small><h3>${boys}</h3><p>${tr('مسار تعليمي مخصص للبنين ضمن الهوية المشتركة للمؤسسة.','A boys secondary-school track within the shared institution experience.')}</p></div><div class="schoolBand alt"><small>GIRLS</small><h3>${girls}</h3><p>${tr('مسار تعليمي مخصص للبنات مع وضوح التسجيل والمتابعة.','A girls secondary-school track with clear registration and follow-up information.')}</p></div></div></div><section class="section"><div class="wrap"><div class="eyebrow">${tr('المسار الأكاديمي','ACADEMIC JOURNEY')}</div><h2 class="sectionTitle">${tr('معلومة مرتبة. قرار أسهل للأهل.','Structured information. Easier decisions for families.')}</h2></div><div class="academicPath">${s.slice(0,4).map((v,i)=>`<div class="pathStep"><span>0${i+1}</span><h3>${esc(v)}</h3><p class="muted">${tr('عرض واضح يربط الخدمة بالمعلومة التي يحتاجها الطالب وولي الأمر.','A clear presentation connecting the service to what students and parents need to know.')}</p></div>`).join('')}</div></section><div class="wrap"><section class="schoolInfo"><div class="schoolPanel"><div class="eyebrow">${tr('الموقع','LOCATION')}</div><h2 class="sectionTitle" style="font-size:32px">${tr('قريب وواضح','Easy to find')}</h2><p class="muted">${esc(address)}</p></div><div class="schoolPanel gold"><div class="eyebrow">${tr('اتجاه بصري مقترح','PROPOSED DIRECTION')}</div><h2 class="sectionTitle" style="font-size:32px">${tr('هيبة أكاديمية بدون تعقيد.','Academic prestige without visual clutter.')}</h2><p class="muted">${tr('كحلي وذهبي، هرمية واضحة، ومحتوى يركز على التسجيل والثقة والمتابعة.','Navy and gold, disciplined hierarchy, and content focused on registration, trust and follow-up.')}</p></div></section><section class="schoolCta"><div><h2 class="sectionTitle" style="color:white;margin:0">${tr('معلومات التسجيل تبدأ من هنا.','Registration information starts here.')}</h2><p class="muted">${esc(x.contact_phone||c.phone||'')}</p></div><div class="actions">${contactActions(c,x,true)}</div></section></div></main><footer class="footer"><div class="wrap">${tr('نموذج تصوري من Digital Compass. الاتجاه البصري مقترح وليس هوية رسمية.','Concept by Digital Compass. Visual direction is proposed, not official identity.')}</div></footer>`}
function automotive(data){const c=data.company,x=data.context,s=services(x),address=x.address_text||c.country;setupDoc('auto',c.name);return `${langButton()}${disclosure(data.disclosure)}${nav(c)}<main><div class="wrap"><section class="autoHero"><div class="reveal"><div class="eyebrow">${tr('تصليح · صبغ · صيانة','REPAIR · PAINT · MAINTENANCE')}</div><h1 class="big">${tr('الشغل الاحترافي لازم يبان من أول ثانية.','Professional work should feel obvious from the first second.')}</h1><p class="lead">${tr('تصور رقمي جريء لورشة سيارات في أبوظبي، يضع الخدمات والاتصال السريع وواتساب في قلب التجربة.','A bold proposed digital experience for an Abu Dhabi workshop, built around service clarity and fast WhatsApp contact.')}</p><div class="actions">${contactActions(c,x,true)}</div></div><div class="carStage reveal d1">${svgCar()}<div class="scan"></div></div></section></div><section class="section divider"><div class="wrap"><div class="eyebrow">${tr('الخدمات','SERVICES')}</div><h2 class="sectionTitle">${tr('كل خدمة لها مسار واضح.','Every service gets a clear lane.')}</h2><div class="autoServices">${s.slice(0,5).map((v,i)=>`<article class="autoService"><span>0${i+1}</span><h3>${esc(v)}</h3></article>`).join('')}</div></div></section><section class="section divider"><div class="wrap autoProof"><div><div class="eyebrow">${tr('الأسلوب المقترح','PROPOSED ART DIRECTION')}</div><h2 class="sectionTitle">${tr('تقني. مباشر. سريع الاستجابة.','Technical. Direct. Built for fast response.')}</h2></div><div class="techBox"><h3>${esc(c.name)}</h3><p class="muted">${tr('تصميم داكن عالي التباين مع أزرق كهربائي، بنية خدمات واضحة، واتصال مباشر بدون خطوات زائدة.','High-contrast dark surfaces, electric blue accents, clear service architecture and direct contact without unnecessary steps.')}</p><p class="muted">${esc(address)}</p></div></div></section><div class="wrap"><section class="autoCta"><div><div class="eyebrow" style="color:#dbeaff">${tr('اتصال سريع','FAST CONTACT')}</div><h2 class="sectionTitle" style="color:#fff;margin-bottom:8px">${tr('من المشكلة إلى واتساب مباشرة.','From the problem straight to WhatsApp.')}</h2><p class="muted">${esc(x.contact_phone||c.phone||'')}</p></div><div class="actions">${contactActions(c,x,true)}</div></section></div></main><footer class="footer"><div class="wrap">${tr('نموذج تصوري من Digital Compass. الصور والهوية الرسمية تُستبدل بعد موافقة النشاط.','Concept by Digital Compass. Official imagery and identity are applied after business approval.')}</div></footer>`}
function preview(data){const sector=(data.company?.sector||'').toLowerCase();if(sector.includes('dental')||sector.includes('clinic')||sector.includes('health'))return clinic(data);if(sector.includes('education')||sector.includes('school'))return school(data);if(sector.includes('auto')||sector.includes('repair'))return automotive(data);return clinic(data)}
function render(){const slug=location.hash.replace(/^#/,'').trim();if(!slug){app.innerHTML=home();return}if(currentData){app.innerHTML=preview(currentData);return}app.innerHTML=`${langButton()}<div class="loading"><div><div class="eyebrow">Digital Compass V2</div><h2>${tr('جاري تحميل النموذج…','Loading tailored concept…')}</h2></div></div>`;fetch(`${API}?slug=${encodeURIComponent(slug)}`,{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{currentData=d;app.innerHTML=preview(d)}).catch(()=>{app.innerHTML=`${langButton()}<div class="error"><div class="errorBox"><h2>${tr('النموذج غير متاح حالياً','Preview unavailable')}</h2><p>${tr('تعذر تحميل البيانات أو لم تكتمل بوابة الهوية بعد.','The data could not be loaded or the brand gate is not ready.')}</p></div></div>`})}
addEventListener('hashchange',()=>{currentData=null;render()});render();
</script>
